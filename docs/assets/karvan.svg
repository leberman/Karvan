<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Karvan: a camel carrying your Claude Code work">
  <title>Karvan</title>
  <!-- ground shadow -->
  <ellipse cx="270" cy="452" rx="170" ry="16" fill="#000" opacity="0.12"/>
  <!-- legs (back pair darker) -->
  <g stroke-linecap="round" stroke-width="26">
    <line x1="196" y1="330" x2="190" y2="440" stroke="#B9824B"/>
    <line x1="352" y1="330" x2="362" y2="440" stroke="#B9824B"/>
    <line x1="226" y1="330" x2="222" y2="442" stroke="#D49A5E"/>
    <line x1="382" y1="330" x2="388" y2="442" stroke="#D49A5E"/>
  </g>
  <!-- hooves -->
  <g fill="#7A5230">
    <rect x="176" y="434" width="28" height="12" rx="6"/>
    <rect x="348" y="434" width="28" height="12" rx="6"/>
    <rect x="208" y="436" width="28" height="12" rx="6"/>
    <rect x="374" y="436" width="28" height="12" rx="6"/>
  </g>
  <!-- tail -->
  <path d="M410 268 q30 18 22 62" fill="none" stroke="#B9824B" stroke-width="10" stroke-linecap="round"/>
  <circle cx="431" cy="334" r="9" fill="#7A5230"/>
  <!-- body with hump -->
  <path d="M168 300
           C160 248 196 228 236 226
           C246 168 290 140 326 150
           C368 162 396 196 404 236
           C424 250 428 300 410 324
           C390 352 330 352 290 350
           L230 350 C196 350 172 336 168 300 Z" fill="#D49A5E"/>
  <!-- belly highlight -->
  <path d="M206 330 C250 344 340 344 388 326" fill="none" stroke="#E8B97F" stroke-width="10" stroke-linecap="round"/>
  <!-- saddle cloth -->
  <path d="M250 232 C262 190 300 172 330 178 C362 186 384 214 388 246
           L376 290 C340 300 290 300 262 290 Z" fill="#2E8C8A"/>
  <path d="M262 290 C290 300 340 300 376 290" fill="none" stroke="#F2C14E" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 14"/>
  <!-- cargo: a chat bubble crate and a document crate -->
  <g>
    <rect x="262" y="104" width="64" height="64" rx="10" fill="#F2C14E" transform="rotate(-6 294 136)"/>
    <path d="M280 122 h30 a6 6 0 0 1 6 6 v14 a6 6 0 0 1 -6 6 h-18 l-9 8 v-8 h-3 a6 6 0 0 1 -6 -6 v-14 a6 6 0 0 1 6 -6 z"
          fill="#fff" transform="rotate(-6 294 136)"/>
    <rect x="320" y="118" width="56" height="64" rx="8" fill="#E86F51" transform="rotate(5 348 150)"/>
    <g transform="rotate(5 348 150)" fill="#fff">
      <rect x="333" y="132" width="30" height="6" rx="3"/>
      <rect x="333" y="146" width="22" height="6" rx="3"/>
      <rect x="333" y="160" width="28" height="6" rx="3"/>
    </g>
    <!-- strap -->
    <path d="M268 170 C300 186 352 190 382 176" fill="none" stroke="#7A5230" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- neck -->
  <path d="M206 250 C176 236 150 196 146 156 L178 150 C184 186 200 214 234 232 Z" fill="#D49A5E"/>
  <!-- head -->
  <ellipse cx="148" cy="138" rx="46" ry="34" fill="#D49A5E"/>
  <ellipse cx="110" cy="150" rx="26" ry="20" fill="#E8B97F"/>
  <!-- ear -->
  <path d="M176 110 q10 -22 20 -6 q-6 12 -20 6 z" fill="#B9824B"/>
  <!-- eye: friendly, closed in a smile -->
  <path d="M140 128 q10 -10 20 0" fill="none" stroke="#3B2A1A" stroke-width="6" stroke-linecap="round"/>
  <!-- cheek -->
  <circle cx="166" cy="146" r="8" fill="#E86F51" opacity="0.35"/>
  <!-- nostril and smile -->
  <circle cx="98" cy="146" r="3.5" fill="#3B2A1A"/>
  <path d="M100 160 q10 8 22 2" fill="none" stroke="#3B2A1A" stroke-width="4" stroke-linecap="round"/>
</svg>
