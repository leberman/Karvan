# goreleaser v2. First public release is Linux only (PRD 10, 11); CI also
# cross-compiles Windows and macOS to keep the code portable.
version: 2

project_name: karvan

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: karvan
    main: ./cmd/karvan
    binary: karvan
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: karvan
    formats: [tar.gz]
    # No version in the name, so releases/latest/download/<name> always
    # works for install.sh.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE-APACHE
      - LICENSE-MIT

nfpms:
  - id: karvan
    package_name: karvan
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    homepage: https://github.com/leberman/karvan
    maintainer: leberman <leberman@users.noreply.github.com>
    description: Continue your Claude Code work on any of your computers.
    license: MIT OR Apache-2.0
    section: utils
    formats: [deb]
    contents:
      - src: LICENSE-MIT
        dst: /usr/share/doc/karvan/LICENSE-MIT
      - src: LICENSE-APACHE
        dst: /usr/share/doc/karvan/LICENSE-APACHE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  disable: true

release:
  draft: false
  extra_files:
    - glob: ./install.sh
